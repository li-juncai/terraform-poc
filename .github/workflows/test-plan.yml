
name: Test Environment Plan
on:
  push:
    paths:
      - 'environments/test/**'
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: Terraform Init
        run: terraform -chdir=environments/test init
      - name: Terraform Plan
        run: terraform -chdir=environments/test plan -out=tfplan
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-plan
          path: environments/test/tfplan
      - name: Create Approval Comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🔍 **Test Plan Complete**
            [View Plan Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ✅ **Approve to move to production**
