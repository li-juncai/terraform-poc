name: Production Environment Plan & Apply
on:
  push:
    branches: [ main ]
    paths:
      - 'environments/prod/**'

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: |
          terraform init -backend-config=backend-config/backend.hcl \
            -backend-config="organization=your-github-org" \
            -backend-config="workspaces.name=terraform-state-${{ github.repository }}"
        working-directory: environments/prod
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: environments/prod
      - name: Create Approval Comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.number }}
          body: |
            ### Production Plan Summary
            ```
            ${{ steps.plan.outputs.stdout }}
            ```
            **Approval Required**: Review the plan and comment `/approve` to apply.
  apply:
    needs: plan
    if: contains(github.event.comment.body, '/approve') && github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: environments/prod
      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: environments/prod
