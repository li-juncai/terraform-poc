name: Test Environment Plan
on:
  pull_request:
    paths:
      - 'environments/test/**'
      - 'modules/alicloud-role/**'

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Terraform Init
        run: |
          terraform init -backend-config=backend-config/backend.hcl \
            -backend-config="organization=your-github-org" \
            -backend-config="workspaces.name=terraform-state-${{ github.repository }}"
        working-directory: environments/test
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: environments/test
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-test
          path: environments/test/tfplan
